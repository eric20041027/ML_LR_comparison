scheduler: onecycle
dataset: imagewoof
num_classes: 10
run_name: onecycle
pretrained: false
epochs: 80
aug: strong
mixup_alpha: 0.2
label_smoothing: 0.1
base_lr: 5.0e-4
max_lr: 5.0e-3        # 10x base; pretrained version uses same ratio
weight_decay: 5.0e-4
batch_size: 128
image_size: 224
num_workers: 2
capture_epochs: [5, 40, 80]
